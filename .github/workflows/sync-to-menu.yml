name: Sync to cigercimiqqo/Menu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to cigercimiqqo/Menu
        env:
          TOKEN: ${{ secrets.MENU_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "MENU_SYNC_TOKEN tanimli degil, sync atlandi."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add menu "https://x-access-token:${TOKEN}@github.com/cigercimiqqo/Menu.git"
          git push menu HEAD:main --force-with-lease
