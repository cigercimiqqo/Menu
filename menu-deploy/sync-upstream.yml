name: Sync from dgdfurkan/CigerciMiqqo

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror upstream menu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml.bak
          git fetch https://github.com/dgdfurkan/CigerciMiqqo.git main:upstream-main
          git checkout upstream-main -- .
          cp /tmp/sync-upstream.yml.bak .github/workflows/sync-upstream.yml
          git add -A
          git diff --staged --quiet && echo "Already up to date" && exit 0
          git commit -m "sync: dgdfurkan/CigerciMiqqo"
          git push
